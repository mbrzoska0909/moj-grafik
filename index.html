<!doctype html><html lang='pl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.webmanifest'><link rel='stylesheet' href='style.css'><title>Mój Grafik</title></head><body><main class='app'><header><div><small>PROTOTYP PWA</small><h1>Mój Grafik</h1><p>Zdjęcie → odczyt → kontrola → kalendarz</p></div><button id='install' hidden>Zainstaluj</button></header>
<section class='card'><h2>1. Dodaj grafik</h2><label class='upload'>📷 Wybierz lub zrób zdjęcie<input id='photo' type='file' accept='image/*' capture='environment'></label><img id='preview' hidden alt='Podgląd grafiku'><p class='hint'>W tej wersji zdjęcie jest podglądem. Automatyczny OCR podepniemy jako następny moduł.</p></section>
<section class='card'><div class='row'><div><h2>2. Grafik — Sierpień 2026</h2><p>Wiersz testowy: BRZÓSKA</p></div><button id='loadSample'>Wczytaj próbkę</button></div><div id='summary'></div><div id='schedule'></div></section>
<section class='card'><h2>3. Sprawdź własny wpis</h2><div class='parse'><input id='entry' placeholder='np. 2/IX, 1/XV, 2/S20, UW'><button id='parseBtn'>Rozpoznaj</button></div><div id='parseResult'></div></section>
<section class='card'><h2>4. Reguły</h2><div id='rules'></div></section>
</main><script src='app.js'></script></body></html>
